<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Merchandise Request</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="paper">
            <h1>College Merchandise Request</h1>
            <div id="error-message" class="alert error" style="display: none;"></div>
            <div id="success-message" class="alert success" style="display: none;"></div>
            
            <form id="request-form">
                <div class="form-group">
                    <h3>Search for your college:</h3>
                    <div class="search-container">
                        <div class="search-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24">
                                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                            </svg>
                        </div>
                        <div class="autocomplete">
                            <input type="text" id="college-search" placeholder="Start typing a college name..." required>
                            <div id="college-dropdown" class="dropdown"></div>
                            <div id="loading-indicator" class="loading" style="display: none;">
                                <div class="spinner"></div>
                            </div>
                        </div>
                    </div>
                    <small>Type at least 2 characters to search</small>
                    <input type="hidden" id="selected-college" name="college_name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <button type="submit" class="btn-submit">Submit Request</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
